# Non ancora attivo: per attivarlo copiare questo file in .github/workflows/plugin.yml.
# Il push di un flusso richiede un accesso a GitHub con il permesso `workflow`
# (gh auth refresh -h github.com -s workflow). Finche' non e' attivo: python3 tools/plugin_branch.py --push
# A ogni push su main rigenera il ramo `plugin`: il plugin per Claude Code con i soli file necessari.
name: Ramo del plugin
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/plugin_branch.py --push
