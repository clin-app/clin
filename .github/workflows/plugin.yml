# A ogni push su main rigenera il ramo `plugin`: il plugin per Claude Code con i soli file necessari.
name: Ramo del plugin
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/plugin_branch.py --push
